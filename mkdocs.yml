site_name: napari-plot
site_url: https://github.com/lukasz-migas/napari-plot
site_author: Lukasz Migas
site_description: >-
  Vispy-based plotting library alongside napari.

nav:
  - Home: index.md
  - Usage: usage.md
  - Examples: examples.md
  - Public API: api.md

# Repository
repo_name: lukasz-migas/napari-plot
repo_url: https://github.com/lukasz-migas/napari-plot

# Copyright
copyright: Copyright &copy; 2021 - present Lukasz Migas

extra_css:
  - assets/css/extra.css

theme:
  icon:
    logo: material/chart-scatter-plot
  name: material
  palette:
    - scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: amber
      accent: yellow
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.tabs
    # - navigation.tracking
    - search.highlight
    - search.suggest
    # - toc.follow
    # - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - changelog

plugins:
  - search
  - autorefs
  - minify:
      minify_html: true
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            filters: ["!^_"]
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
