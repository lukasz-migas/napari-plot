name: Test

on:
  push:
    branches:
      - main
      - "v*x"
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
      - "v*x"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COLUMNS: 120

jobs:
  check-manifest:
    name: Check Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uvx check-manifest

  test_uv:
    name: Test UV (${{ matrix.backend }} ${{ matrix.python-version }} ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      QT_API: ${{ matrix.backend }}
      UV_NO_SYNC: "1"
      UV_MANAGED_PYTHON: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        backend: [pyside6, pyqt6]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev --group test --extra ${{ matrix.backend }} --extra optional

      - uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true

      - name: Test
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: >
          uv run python -X faulthandler
          -m coverage run -p -m pytest -v --color=yes

      - name: Install GDB
        if: failure() && runner.os == 'Linux' && matrix.backend == 'pyqt6'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdb

      - name: Collect native crash backtrace
        if: failure() && runner.os == 'Linux' && matrix.backend == 'pyqt6'
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          gdb --batch --nx \
            -ex "set pagination off" \
            -ex "handle SIGPIPE nostop noprint pass" \
            -ex run \
            -ex "bt full" \
            -ex "thread apply all bt 30" \
            --args .venv/bin/python -X faulthandler \
              -m coverage run -p -m pytest -v --color=yes

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: covreport-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.backend }}
          path: ./.coverage*
          include-hidden-files: true
