name: Test and deploy

on:
  push:
    branches:
      - main
      - "v*x"
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
      - "v*x"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COLUMNS: 120

jobs:
  check-manifest:
    name: Quality and package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uvx check-manifest
      - run: uvx ruff check napari_plot tests
      - run: uvx --from npe2 npe2 validate napari_plot/napari.yaml

  build-smoke:
    name: Build and installed-package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv build
      - name: Validate distribution metadata
        run: uvx twine check dist/*
      - run: uv venv .wheel-smoke-venv
      - run: uv pip install --python .wheel-smoke-venv/bin/python dist/*.whl pyqt6
      - run: uv venv .sdist-smoke-venv
      - run: uv pip install --python .sdist-smoke-venv/bin/python dist/*.tar.gz pyqt6
      - name: Set up Linux display and Qt system libraries
        uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true
      - name: Import public API from wheel installation
        working-directory: ${{ runner.temp }}
        run: >
          ${{ github.workspace }}/.wheel-smoke-venv/bin/python -c
          "import napari_plot; [getattr(napari_plot, name) for name in napari_plot.__all__]"
      - name: Import plugin command targets from wheel installation
        working-directory: ${{ runner.temp }}
        run: >
          ${{ github.workspace }}/.wheel-smoke-venv/bin/python -c
          "from npe2 import PluginManifest; from npe2.manifest.utils import import_python_name;
          import napari_plot; manifest = PluginManifest.from_file(napari_plot.__path__[0] + '/napari.yaml');
          [import_python_name(command.python_name) for command in manifest.contributions.commands]"
      - name: Import public API from source distribution installation
        working-directory: ${{ runner.temp }}
        run: >
          ${{ github.workspace }}/.sdist-smoke-venv/bin/python -c
          "import napari_plot; [getattr(napari_plot, name) for name in napari_plot.__all__]"
      - name: Import plugin command targets from source distribution installation
        working-directory: ${{ runner.temp }}
        run: >
          ${{ github.workspace }}/.sdist-smoke-venv/bin/python -c
          "from npe2 import PluginManifest; from npe2.manifest.utils import import_python_name;
          import napari_plot; manifest = PluginManifest.from_file(napari_plot.__path__[0] + '/napari.yaml');
          [import_python_name(command.python_name) for command in manifest.contributions.commands]"

      - name: Upload package distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  test_uv:
    name: Test UV (${{ matrix.backend }} ${{ matrix.python-version }} ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      QT_API: ${{ matrix.backend }}
      UV_NO_SYNC: "1"
      UV_MANAGED_PYTHON: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        backend: [pyside6, pyqt6]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev --group test --extra ${{ matrix.backend }} --extra optional

      - uses: pyvista/setup-headless-display-action@v4
        with:
          qt: true

      - name: Test
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: >
          uv run python -X faulthandler
          -m coverage run -p -m pytest -v --color=yes

      - name: Install GDB
        if: failure() && runner.os == 'Linux' && matrix.backend == 'pyqt6'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdb

      - name: Collect native crash backtrace
        if: failure() && runner.os == 'Linux' && matrix.backend == 'pyqt6'
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          gdb --batch --nx \
            -ex "set pagination off" \
            -ex "handle SIGPIPE nostop noprint pass" \
            -ex run \
            -ex "bt full" \
            -ex "thread apply all bt 30" \
            --args .venv/bin/python -X faulthandler \
              -m coverage run -p -m pytest -v --color=yes

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: covreport-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.backend }}
          path: ./.coverage*
          include-hidden-files: true

  deploy-test:
    name: Publish to TestPyPI
    needs: [check-manifest, build-smoke, test_uv]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  deploy:
    name: Publish to PyPI
    needs: deploy-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Create GitHub release
    needs: deploy
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          files: dist/*
